name: Actualizar datos de Leaguepedia

on:
  schedule:
    - cron: '*/5 * * * *'    # cada 5 minutos (GitHub puede retrasarlo; el directo va aparte, por el Worker)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Descargar datos
        env:
          LP_USERNAME: ${{ secrets.LP_USERNAME }}
          LP_PASSWORD: ${{ secrets.LP_PASSWORD }}
        run: python3 scripts/update_data.py

      - name: Descargar datos de lolesports.com
        if: always()
        continue-on-error: true   # si lolesports cambia su API, la web sigue con Leaguepedia
        run: python3 scripts/update_lolesports.py

      - name: Guardar cambios
        if: always()
        run: |
          # Solo se hace commit si han cambiado datos de verdad
          # (meta.json y .state.json cambian en cada ejecución)
          if ! git status --porcelain --untracked-files=all -- data | grep -v -e 'data/meta.json' -e 'data/.state.json' | grep -q .; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data/ solo la escribe este workflow: se aparta, se trae la última versión
          # del repositorio y se vuelve a colocar encima. Así no hay que mezclar nada
          # aunque mientras tanto hayas subido otros ficheros.
          cp -r data "$RUNNER_TEMP/data-nueva"
          for intento in 1 2 3; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            rm -rf data
            cp -r "$RUNNER_TEMP/data-nueva" data
            git add -A data
            if git diff --cached --quiet; then
              echo "Sin cambios en los datos."
              exit 0
            fi
            git commit -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "El repositorio ha cambiado durante la subida; reintento ($intento)…"
            sleep 5
          done
          exit 1
