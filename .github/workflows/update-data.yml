name: Actualizar datos de Leaguepedia

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Descargar datos
        env:
          LP_USERNAME: ${{ secrets.LP_USERNAME }}
          LP_PASSWORD: ${{ secrets.LP_PASSWORD }}
        run: python3 scripts/update_data.py

      - name: Guardar cambios
        if: always()
        run: |
          # Solo se hace commit si han cambiado datos de verdad
          # (meta.json y .state.json cambian en cada ejecución)
          if git status --porcelain -- data | grep -v -e 'data/meta.json' -e 'data/.state.json' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          else
            echo "Sin cambios en los datos."
          fi
